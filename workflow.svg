<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7895a9"/></marker></defs><rect width="1500" height="520" fill="#f5f8fa"/><text x="60" y="62" font-family="Segoe UI,Arial" font-size="15" font-weight="700" letter-spacing="3" fill="#26888a">MAIN WORKFLOW</text><text x="60" y="104" font-family="Georgia,serif" font-size="35" fill="#102a43">From registration to faster record retrieval</text>
  <g stroke="#7895a9" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M255 252 H320"/><path d="M515 252 H580"/><path d="M775 252 H840"/><path d="M1035 252 H1100"/><path d="M1295 252 H1360"/></g>
  <g font-family="Segoe UI,Arial"><g><rect x="60" y="175" width="195" height="155" rx="16" fill="#fff" stroke="#d3e1e9"/><circle cx="98" cy="214" r="19" fill="#dfeefa"/><text x="98" y="220" text-anchor="middle" font-size="12" font-weight="800" fill="#28648d">01</text><text x="82" y="260" font-size="18" font-weight="750" fill="#19364e">Register patient</text><text x="82" y="290" font-size="13" fill="#607687">Identity, symptoms and</text><text x="82" y="312" font-size="13" fill="#607687">visit information</text></g><g><rect x="320" y="175" width="195" height="155" rx="16" fill="#fff" stroke="#d3e1e9"/><circle cx="358" cy="214" r="19" fill="#dff3ee"/><text x="358" y="220" text-anchor="middle" font-size="12" font-weight="800" fill="#23755f">02</text><text x="342" y="260" font-size="18" font-weight="750" fill="#19364e">Assess priority</text><text x="342" y="290" font-size="13" fill="#607687">Visible scoring rules and</text><text x="342" y="312" font-size="13" fill="#607687">department suggestion</text></g><g><rect x="580" y="175" width="195" height="155" rx="16" fill="#102a43"/><circle cx="618" cy="214" r="19" fill="#2878c8"/><text x="618" y="220" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">03</text><text x="602" y="260" font-size="18" font-weight="750" fill="#fff">Order queue</text><text x="602" y="290" font-size="13" fill="#c8dbe6">Higher risk is handled</text><text x="602" y="312" font-size="13" fill="#c8dbe6">before routine cases</text></g><g><rect x="840" y="175" width="195" height="155" rx="16" fill="#fff" stroke="#d3e1e9"/><circle cx="878" cy="214" r="19" fill="#fff0dc"/><text x="878" y="220" text-anchor="middle" font-size="12" font-weight="800" fill="#99600b">04</text><text x="862" y="260" font-size="18" font-weight="750" fill="#19364e">Assign care</text><text x="862" y="290" font-size="13" fill="#607687">Match doctor, time and</text><text x="862" y="312" font-size="13" fill="#607687">available resources</text></g><g><rect x="1100" y="175" width="195" height="155" rx="16" fill="#fff" stroke="#d3e1e9"/><circle cx="1138" cy="214" r="19" fill="#eee8fb"/><text x="1138" y="220" text-anchor="middle" font-size="12" font-weight="800" fill="#684a99">05</text><text x="1122" y="260" font-size="18" font-weight="750" fill="#19364e">Update history</text><text x="1122" y="290" font-size="13" fill="#607687">Store appointments,</text><text x="1122" y="312" font-size="13" fill="#607687">allocations and outcome</text></g><g><rect x="1360" y="175" width="100" height="155" rx="16" fill="#e3f4f1" stroke="#9bcfc5"/><text x="1410" y="224" text-anchor="middle" font-size="12" font-weight="800" fill="#23755f">06</text><text x="1410" y="260" text-anchor="middle" font-size="16" font-weight="750" fill="#19364e">Retrieve</text><text x="1410" y="286" text-anchor="middle" font-size="13" fill="#607687">B+ index</text><text x="1410" y="307" text-anchor="middle" font-size="13" fill="#607687">search</text></g></g>
  <text x="60" y="417" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#19364e">Safety boundary</text><text x="60" y="445" font-family="Segoe UI,Arial" font-size="14" fill="#607687">The assessment demonstrates prioritisation logic only. A qualified healthcare professional makes every real medical decision.</text>
</svg>
