dee7"/><text x="515" y="494" font-size="20" font-weight="750" fill="#19364e">ALLOCATIONS</text><text x="515" y="525" font-size="13" fill="#2878c8">PK  id</text><text x="515" y="550" font-size="13" fill="#607687">FK  patient_id · resource_id</text><text x="515" y="575" font-size="13" fill="#607687">quantity · time</text><text x="515" y="600" font-size="13" fill="#607687">status</text></g><g><rect x="900" y="455" width="320" height="175" rx="15" fill="#fff" stroke="#cfdee7"/><text x="925" y="494" font-size="20" font-weight="750" fill="#19364e">RESOURCES</text><text x="925" y="525" font-size="13" fill="#2878c8">PK  id</text><text x="925" y="550" font-size="13" fill="#607687">name · code</text><text x="925" y="575" font-size="13" fill="#607687">total</text><text x="925" y="600" font-size="13" fill="#607687">occupied</text></g></g><text x="80" y="690" font-family="Segoe UI,Arial" font-size="14" fill="#607687">The settings table stores department names and patient index keys used by the demonstration interface.</text>
